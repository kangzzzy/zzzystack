<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>가상 셀 HMI · LVGL 문서 어댑터</title><style>
body{font:16px system-ui;background:#edf2f7;color:#182a40;margin:24px;max-width:1100px}header,section{background:white;padding:20px;margin:16px 0;border-radius:12px}h1{font-size:25px}button,select{font:inherit;padding:12px;margin:5px;border:1px solid #60758d;border-radius:6px;background:#fff}button:focus-visible,select:focus-visible{outline:3px solid #1869c7;outline-offset:3px}button:active{background:#c5defc}button:disabled{background:#e1e6ec;color:#596577}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #a1b0c0;padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#reason{color:#983b16;font-weight:bold}@media(max-width:650px){#cards{grid-template-columns:1fr}}
</style><header><h1>D1 → R1 → D2 자동화 셀</h1><p>HTML 시뮬레이션 · 실제 제어 없음 · LVGL 런타임 미사용</p><label>가상 역할 <select id="role"><option value="operator">작업자</option><option value="maintenance">유지보수</option></select></label></header><section><h2>장비 상태</h2><div id="cards"></div><p id="phase" aria-live="polite"></p><p id="reason" role="status"></p><button id="start">사이클 시작</button><button id="pause">일시정지 / 해제</button><p>일시정지: 신규 배정 억제. HW 비상정지는 독립 안전 회로에서 담당합니다.</p></section><section><h2>시뮬레이터 입력</h2><p>아래 버튼은 가상 제어기 응답과 현장 확인을 주입합니다. 실제 센서값이 아닙니다.</p><button id="ack">ACK 수신</button><button id="done">DONE 수신</button><button id="dispatch">다음 단계 배정</button><button id="loss">R1 통신 두절 (3초 경과)</button><button id="timeout">ACK 시간 초과 (2초)</button><button id="reconnect">재접속</button><button id="check">상태 대조 + 현장 확인 (이송 완료)</button><button id="recover">복구 확정</button><button id="safety">안전 입력 정상 / 비정상</button><button id="door">문 닫힘 / 열림</button><button id="clear">알람 표시 지우기</button></section><section><h2>명령 요청 / ACK / DONE · 감사 이력</h2><pre id="history"></pre></section><script>
function createCell(){
 const s={phase:'IDLE',role:'operator',paused:false,safe:true,closed:true,unknown:false,checked:false,lock:false,alarm:'없음',cycle:0,seq:0,cmd:null,history:[],d:{D1:{state:'IDLE',part:true,online:true,fresh:true},D2:{state:'IDLE',part:false,online:true,fresh:true},R1:{state:'IDLE',part:false,online:true,fresh:true}}};
 function log(x){s.history.push(x)}
 function reason(){if(s.unknown)return '결과 불명: 배정 금지. 재접속 → 상태 대조·현장 확인 → 유지보수 복구 확정';if(!s.safe)return '안전 입력 비정상';if(!s.closed)return '관련 문 열림';if(Object.values(s.d).some(d=>!d.online||!d.fresh))return '연결 끊김 또는 오래된 상태';if(s.paused)return '일시정지: 신규 배정 금지';return ''}
 function issue(target,type){s.cmd={command_id:'sim-'+s.cycle+'-'+(++s.seq),cycle_id:'cycle-'+s.cycle,target,type,status:'REQUEST'};log(JSON.stringify(s.cmd));}
 function act(a){
 if(a==='pause'){s.paused=!s.paused;log('일시정지 '+s.paused);return true}
 if(a==='safety'){s.safe=!s.safe;return true}if(a==='door'){s.closed=!s.closed;return true}
 if(a==='clear'){s.alarm='표시 지움 (복구 아님)';return true}
 if(a==='loss'||a==='timeout'){if(!s.cmd||s.cmd.status==='DONE')return false;s.unknown=true;s.checked=false;s.alarm='결과 불명';if(a==='loss'){s.d.R1.online=false;s.d.R1.fresh=false;s.d.R1.state='OFFLINE'}log(a+': 자동 재전송 없음');return true}
 if(a==='reconnect'){s.d.R1.online=true;s.d.R1.fresh=false;log('재접속: 실제 상태 미확인');return true}
 if(a==='check'){if(!s.unknown||!s.d.R1.online||s.phase!=='TRANSFER')return false;Object.assign(s.d.D1,{state:'IDLE',part:false});Object.assign(s.d.D2,{state:'READY',part:true});Object.assign(s.d.R1,{state:'IDLE',part:false,fresh:true});s.checked=true;log('가상 제어기 스냅샷 및 현장 확인: D2 적재·R1 유휴');return true}
 if(a==='recover'){if(s.role!=='maintenance'||!s.unknown||!s.checked||!s.safe||!s.closed)return false;s.unknown=false;s.lock=false;s.phase='D2_READY';s.cmd.status='DONE';s.alarm='복구 확정';log('유지보수 복구 확정: 자동 재개 없음');return true}
 if(a==='start'){if(reason()||!['IDLE','COMPLETE'].includes(s.phase)||s.d.D1.state!=='IDLE'||!s.d.D1.part)return false;s.cycle++;s.phase='D1';s.d.D1.state='PROCESSING';issue('D1','PROCESS');return true}
 if(a==='ack'){if(s.unknown||!s.cmd||s.cmd.status!=='REQUEST')return false;s.cmd.status='ACK';log('ACK: 수신 확인, 실제 완료 아님');return true}
 if(a==='done'){if(s.unknown||!s.cmd||s.cmd.status==='DONE')return false;s.cmd.status='DONE';log('DONE: 가상 제어기 완료 응답');if(s.phase==='D1'){s.d.D1.state='READY';s.phase='TRANSFER_READY'}else if(s.phase==='TRANSFER'){s.d.D1.state='IDLE';s.d.D1.part=false;s.d.D2.part=true;s.d.D2.state='READY';s.d.R1.state='IDLE';s.lock=false;s.phase='D2_READY'}else if(s.phase==='D2'){s.d.D2.state='READY';s.phase='COMPLETE'}return true}
 if(a==='dispatch'){if(reason())return false;if(s.phase==='TRANSFER_READY'){if(s.lock||s.d.D1.state!=='READY'||!s.d.D1.part||s.d.D2.state!=='IDLE'||s.d.D2.part||s.d.R1.state!=='IDLE')return false;s.lock=true;s.phase='TRANSFER';s.d.R1.state='BUSY';issue('R1','TRANSFER');return true}if(s.phase==='D2_READY'){s.phase='D2';s.d.D2.state='PROCESSING';issue('D2','PROCESS');return true}}
 return false;
 }
 return {s,act,reason};
}
const cell=createCell();
function render(){const s=cell.s;document.getElementById('cards').innerHTML=Object.entries(s.d).map(([id,d])=>`<article class="card"><h3>${id}</h3><p>${d.state} · ${d.online?'연결':'끊김'}</p><p>상태 ${d.fresh?'최신':'미확인'}</p><p>공작물 ${d.part?'있음':'없음'}</p><p>문 ${s.closed?'닫힘':'열림'} · 안전 ${s.safe?'정상':'비정상'}</p></article>`).join('');document.getElementById('phase').textContent=`단계: ${s.phase} / 점유: ${s.lock?'확보':'없음'}`;document.getElementById('reason').textContent=cell.reason()||s.alarm;document.getElementById('history').textContent=s.history.join('\n');document.getElementById('start').disabled=!!cell.reason()||s.phase!=='IDLE';document.getElementById('dispatch').disabled=!!cell.reason()||!['TRANSFER_READY','D2_READY'].includes(s.phase);document.getElementById('recover').disabled=s.role!=='maintenance'||!s.unknown||!s.checked||!s.safe||!s.closed;}
if(typeof document!=='undefined'){document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(!cell.act(b.id))cell.s.history.push('拒否 / 거부: '+b.id);render()}));document.getElementById('role').addEventListener('change',e=>{cell.s.role=e.target.value;render()});render();}
</script></html>
